[project]
name = "medvox-server"
version = "0.1.0"
description = "MedVox Server: lokale Diktat-Transkription und BEMA/GOZ-Vorschläge für die Zahnarztpraxis"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-multipart",
    "pydantic",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medvox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
